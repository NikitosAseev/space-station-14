- type: entity
  parent: BaseAction
  id: ActionVampireDrinkBlood
  name: Feed
  description: Drink blood from a creature.
  components:
  - type: Action
    icon:
      sprite: _Den/Interface/Actions/actions_vampire.rsi
      state: fangs
    useDelay: 2.0
    itemIconStyle: BigAction
  - type: TargetAction
    repeat: false
    deselectOnMiss: true
    range: 1.0
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:VampireDrinkBloodAbility
    whitelist:
      components:
      - Body
    canTargetSelf: false

- type: entity
  parent: BaseAction
  id: ActionVampireGlareAbility
  name: Glare
  description: Instill fear and despair in those around you, weakening their resolve, stunning and silencing them.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Den/Interface/Actions/actions_vampire.rsi
      state: glare
    useDelay: 1.0
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/_Den/Effects/blind.ogg
  - type: AutoRecharge
    rechargeDuration: 20
  - type: LimitedCharges
    maxCharges: 2
  - type: InstantAction
    event: !type:VampireGlareAbility